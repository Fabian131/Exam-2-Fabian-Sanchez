openapi: 3.0.3
info:
  title: Get Ticket by ID API
  version: 1.0.0

paths:
  /api/tickets/{ticketId}:
    get:
      summary: Get ticket by ID
      description: Returns detailed information for a specific ticket.
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    TicketResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        providerName:
          type: string
        category:
          type: string
        priority:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reportedBy:
          type: string
        location:
          type: string

    ErrorResponse:
      type: object
      properties:
        message:
          type: string